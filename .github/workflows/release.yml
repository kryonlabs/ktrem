---
name: Build and Release

"on":
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  KTREM_DIR: ktrem
  KRYON_CHECKOUT_DIR: kryon

jobs:
  linux-build:
    name: Linux build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out ktrem
        uses: actions/checkout@v4
        with:
          path: ${{ env.KTREM_DIR }}

      - name: Check out Kryon
        uses: actions/checkout@v4
        with:
          repository: kryonlabs/kryon
          path: ${{ env.KRYON_CHECKOUT_DIR }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            curl \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            file \
            libbrotli-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libsdl2-dev \
            libzstd-dev \
            pkg-config \
            zlib1g-dev

      - name: Build Kryon
        working-directory: ${{ env.KRYON_CHECKOUT_DIR }}
        run: make all

      - name: Test ktrem
        working-directory: ${{ env.KTREM_DIR }}
        env:
          ENGINE_DIR: ${{ github.workspace }}/${{ env.KRYON_CHECKOUT_DIR }}
        run: make ENGINE_DIR="${ENGINE_DIR}" test

      - name: Build ktrem
        working-directory: ${{ env.KTREM_DIR }}
        env:
          ENGINE_DIR: ${{ github.workspace }}/${{ env.KRYON_CHECKOUT_DIR }}
        run: make ENGINE_DIR="${ENGINE_DIR}" all

      - name: Package Linux release assets
        working-directory: ${{ env.KTREM_DIR }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          version="$(printf '%s' "${version}" | tr '/ :' '---')"
          deb_version="$(printf '%s' "${version}" | sed 's/^v//; s/[^A-Za-z0-9.+:~_-]/-/g')"
          case "${deb_version}" in
            [0-9]*) ;;
            *) deb_version="0.0.0+${deb_version}" ;;
          esac
          package="ktrem-linux-x86_64-${version}"
          mkdir -p "dist/${package}/bin"
          cp build/linux-x86_64/bin/ktrem "dist/${package}/bin/ktrem"
          cp build/linux-x86_64/lib/ktrem-host.so "dist/${package}/bin/ktrem-host.so"
          cp README.md "dist/${package}/README.md"
          cp docs/REMAINING_FEATURE_PLAN.md \
            "dist/${package}/REMAINING_FEATURE_PLAN.md"
          if [ -d benchmarks/results ]; then
            mkdir -p "dist/${package}/benchmarks"
            cp benchmarks/README.md "dist/${package}/benchmarks/README.md"
          fi
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

          deb_root="dist/deb/ktrem_${deb_version}_amd64"
          mkdir -p "${deb_root}/DEBIAN" \
            "${deb_root}/usr/bin" \
            "${deb_root}/usr/lib/rill/apps" \
            "${deb_root}/usr/share/applications" \
            "${deb_root}/usr/share/doc/ktrem" \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps"
          cp build/linux-x86_64/bin/ktrem "${deb_root}/usr/bin/ktrem"
          cp build/linux-x86_64/lib/ktrem-host.so \
            "${deb_root}/usr/lib/rill/apps/ktrem-host.so"
          cp README.md "${deb_root}/usr/share/doc/ktrem/README.md"
          cp docs/site/favicon.svg \
            "${deb_root}/usr/share/icons/hicolor/scalable/apps/ktrem.svg"
          cat > "${deb_root}/usr/share/applications/ktrem.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ktrem
          Comment=Kryon terminal emulator
          Exec=ktrem
          Icon=ktrem
          Terminal=false
          Categories=System;TerminalEmulator;
          Keywords=shell;prompt;command;terminal;
          EOF
          cat > "${deb_root}/DEBIAN/control" <<EOF
          Package: ktrem
          Version: ${deb_version}
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Kryon Labs <noreply@kryonlabs.com>
          Depends: libc6, libssl3, libsdl2-2.0-0, libgtk-3-0, zlib1g
          Description: Kryon terminal emulator
           ktrem is a standalone terminal application using Kryon for windowing,
           rendering, input, and platform integration.
          EOF
          dpkg-deb --build --root-owner-group "${deb_root}" \
            "dist/ktrem_${deb_version}_amd64.deb"

          appdir="dist/AppDir"
          mkdir -p "${appdir}/usr/bin" \
            "${appdir}/usr/lib/rill/apps" \
            "${appdir}/usr/share/applications" \
            "${appdir}/usr/share/icons/hicolor/scalable/apps"
          cp build/linux-x86_64/bin/ktrem "${appdir}/usr/bin/ktrem"
          cp build/linux-x86_64/lib/ktrem-host.so \
            "${appdir}/usr/lib/rill/apps/ktrem-host.so"
          cp docs/site/favicon.svg \
            "${appdir}/usr/share/icons/hicolor/scalable/apps/ktrem.svg"
          cp "${deb_root}/usr/share/applications/ktrem.desktop" \
            "${appdir}/usr/share/applications/ktrem.desktop"
          cp "${appdir}/usr/share/applications/ktrem.desktop" \
            "${appdir}/ktrem.desktop"
          ln -s usr/share/icons/hicolor/scalable/apps/ktrem.svg \
            "${appdir}/ktrem.svg"
          cat > "${appdir}/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/ktrem" "$@"
          EOF
          chmod +x "${appdir}/AppRun"
          curl -fL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "${appdir}" "dist/ktrem-x86_64-${version}.AppImage"

          sha256sum "dist/${package}.tar.gz" \
            "dist/ktrem_${deb_version}_amd64.deb" \
            "dist/ktrem-x86_64-${version}.AppImage" > "dist/SHA256SUMS"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktrem-linux-x86_64
          path: |
            ${{ env.KTREM_DIR }}/dist/*.tar.gz
            ${{ env.KTREM_DIR }}/dist/*.deb
            ${{ env.KTREM_DIR }}/dist/*.AppImage
            ${{ env.KTREM_DIR }}/dist/SHA256SUMS

      - name: Upload release assets
        if: github.event_name == 'release'
        working-directory: ${{ env.KTREM_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "${RELEASE_TAG}"
          dist/*.tar.gz dist/*.deb dist/*.AppImage dist/SHA256SUMS --clobber
